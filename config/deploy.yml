service: barahla-net
image: ghcr.io/aptennn/barahla-net

servers:
  web:
    - "<%= ENV['SERVER_IP'] %>"

env:
  clear:
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: true
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_PASSWORD
    - KAMAL_REGISTRY_PASSWORD

registry:
  server: ghcr.io
  username: Gufort
  password:
    - KAMAL_REGISTRY_PASSWORD

accessories:
  traefik:
    image: traefik:v2.10
    host: "<%= ENV['SERVER_IP'] %>"
    options:
      publish:
        - "80:80"
        - "443:443"
      volume:
        - /var/run/docker.sock:/var/run/docker.sock
        - /letsencrypt:/letsencrypt
    cmd: "--entryPoints.web.address=:80 --entryPoints.websecure.address=:443 --certificatesResolvers.letsencrypt.acme.email=<%= ENV['LETSENCRYPT_EMAIL'] %> --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json --certificatesResolvers.letsencrypt.acme.httpchallenge.entryPoint=web"

builder:
  arch: amd64